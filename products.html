<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — SipSmart</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/products.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-brand">
    <div class="nav-logo-icon">🍷</div>
    Sip<span>Smart</span>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="products.html" class="active">Shop</a></li>
    <li><a href="cart.html" class="nav-cart-btn">
      🛒 Cart
      <span class="cart-badge" style="display:none">0</span>
    </a></li>
    <li><a href="#" id="nav-user-link" class="btn btn-primary btn-sm">Sign In</a></li>
  </ul>
  <div class="nav-toggle"><span></span><span></span><span></span></div>
</nav>

<div class="page-header">
  <h1>Our <span class="gold">Products</span></h1>
  <p>Premium drinks delivered to your door</p>
</div>

<!-- ─── Filters & Search ────────────────────────────────────────────────── -->
<div class="shop-toolbar">
  <div class="container toolbar-inner">
    <div class="category-filters">
      <button class="filter-btn active" data-cat="All">All</button>
      <button class="filter-btn" data-cat="Beer">🍺 Beer</button>
      <button class="filter-btn" data-cat="Wine">🍷 Wine</button>
      <button class="filter-btn" data-cat="Spirits">🥃 Spirits</button>
      <button class="filter-btn" data-cat="Cider">🍏 Cider</button>
    </div>
    <div class="search-wrap">
      <input type="text" id="search-input" placeholder="Search products…" class="search-input">
      <span class="search-icon">🔍</span>
    </div>
  </div>
</div>

<!-- ─── Products Grid ───────────────────────────────────────────────────── -->
<section class="section">
  <div class="container">
    <div class="results-info" id="results-info"></div>
    <div class="products-grid" id="products-grid">
      <div class="loading-overlay">
        <div class="spinner"></div>
        <p>Loading products…</p>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="footer-warning">
    ⚠️ Not for persons under 18. Drink responsibly. Alcohol is harmful to your health.
  </div>
  <div class="footer-bottom" style="max-width:1200px;margin:0 auto;padding-top:.5rem;">
    <p>&copy; 2024 SipSmart Zimbabwe. All rights reserved.</p>
  </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/products.js"></script>
</body>
</html>
