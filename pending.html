<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification Status — SipSmart</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-brand">
    <div class="nav-logo-icon">🍷</div>
    Sip<span>Smart</span>
  </a>
  <ul class="nav-links">
    <li><a href="#" id="nav-logout-link" onclick="handleLogout()">Log Out</a></li>
  </ul>
</nav>

<section class="section">
  <div class="container" style="max-width:600px;text-align:center;padding:3rem 1rem">
    <div id="status-icon" style="font-size:3.5rem;margin-bottom:1rem">⏳</div>
    <h1 id="status-title">Your account is under review</h1>
    <p id="status-message" style="color:var(--neutral-400);margin-top:1rem;line-height:1.6">
      Thanks for registering! Our team is reviewing your submitted ID. This usually doesn't take long — check back shortly.
    </p>
    <a href="index.html" class="btn btn-outline" style="margin-top:2rem">Back to Home</a>
  </div>
</section>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const status = params.get('status') || 'pending';

  if (status === 'rejected') {
    document.getElementById('status-icon').textContent = '❌';
    document.getElementById('status-title').textContent = 'ID verification was not approved';
    document.getElementById('status-message').textContent =
      'Unfortunately your submitted ID could not be verified. Please contact support(0788840432) or try registering again with a clearer document.';
  }

  // If somehow approved and they land here, send them straight to shop
    auth.onAuthStateChanged(async user => {
    if (!user) { window.location.href = 'login.html'; return; }
    const res = await fetch(`${API_BASE}/users/${user.uid}`);
    const json = await res.json();
    if (json.success && json.data && json.data.verification_status === 'approved') {
      window.location.href = 'products.html';
    }
  });
</script>
</body>
</html>
